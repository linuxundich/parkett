[package]
name = "parkett"
description = "Terminal emulator for GNOME with splits"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parkett-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
vte = { package = "vte4", version = "0.10", features = ["v0_80"] }
# already pulled in via gtk4; only enables features (user_state_dir, print_literal)
glib = { version = "0.22", features = ["v2_72"] }
gio = { version = "0.22", features = ["v2_80"] }
libc = "0.2"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
