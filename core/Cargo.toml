[package]
name = "parkett-core"
description = "Parkett: split layout, sessions and profiles without GTK"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Messages that reach the UI (command line, load errors); the app sets the text domain
gettext-rs = { version = "0.8", features = ["gettext-system"] }
