[package]
name = "parkett-core"
description = "Parkett: Split-Layout, Sitzungen und Profile ohne GTK"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Meldungen, die bis in die Oberfläche gehen (Befehlszeile, Ladefehler); Textdomäne setzt die App
gettext-rs = { version = "0.8", features = ["gettext-system"] }
