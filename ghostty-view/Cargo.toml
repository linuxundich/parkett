[package]
name = "ghostty-view"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "GTK4 terminal widget on libghostty-vt (optional second backend of Parkett)"

[dependencies]
ghostty-vt = { path = "../ghostty-vt" }
parkett-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
glib = { version = "0.22", features = ["v2_72"] }
glib-unix = "0.22"
